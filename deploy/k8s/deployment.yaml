# The console, next to the platform it manages.
#
# No namespace here on purpose: the pipeline passes `-n "$NAMESPACE"` from a
# repository variable, and leaving it out keeps these files applicable to a
# scratch namespace without an edit. See README.md in this directory.
#
# `CONSOLE_IMAGE` and `SECRETS_CHECKSUM` are placeholders the deploy workflow
# substitutes. The image is tagged by commit sha and a tag is never reused, so
# every rollout on a new commit is a real pod replacement rather than a no-op
# apply; the checksum covers the case where the commit did *not* change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app.kubernetes.io/name: console
    app.kubernetes.io/part-of: managed-agent-platform
spec:
  # One replica: the console holds no state a second one would share, and a
  # single-tenant staging deployment gains nothing from two.
  replicas: 1
  # How far back `rollout undo` can reach, and it is a security boundary here
  # rather than housekeeping. Old ReplicaSets keep their whole pod template,
  # `secretKeyRef`s included, so an unbounded history means a credential can
  # never be retired: the key has to stay in the Secret to keep a rollback
  # target startable, which is precisely why `console-password` outlived its
  # own removal from this file. Bounding the window turns that from a wait of
  # unknown length into a decision — and lowering the limit prunes immediately
  # rather than at the next rollout, verified against the live cluster.
  #
  # Three, not the default ten, because the only automatic consumer is the
  # workflow's rollback step, which names the revision that was serving before
  # the run rather than counting backwards. Three leaves that target and room
  # to spare; ten only lengthens the tail of templates nobody may safely delete
  # a Secret key out from under.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console
      annotations:
        # sha256 of the Secret Manager payload this revision was deployed with.
        # Rotating a credential changes no other field in this file, so
        # without this the re-run applies byte-identically, nothing rolls,
        # `rollout status` returns instantly green, and the pod keeps serving
        # with the old value — a re-deploy that reports success and did nothing.
        # The platform chart carries the same annotation on its control-plane
        # Deployment for the same reason. Substituted by the pipeline.
        #
        # Quoted, and not for style: annotation values are strings, and a sha256
        # rendered in hex is all decimal digits often enough to matter — YAML
        # then reads it as an integer and the API server refuses the whole apply
        # with "cannot convert int64 to string", on a run nobody could reproduce
        # from the diff. The quotes make the type independent of the digest.
        console-secrets/checksum: "SECRETS_CHECKSUM"
    spec:
      securityContext:
        runAsNonRoot: true
        # The image ends on `USER node`, a *name*. kubelet cannot prove a named
        # user is non-root, so `runAsNonRoot: true` alone refuses to start the
        # container ("non-numeric user (node), cannot verify user is non-root").
        # 1000/1000 is what `node` resolves to in the node:24-alpine base image
        # (verified with `id node`), stated numerically so the check can pass.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: CONSOLE_IMAGE
          ports:
            - name: http
              containerPort: 3000
          env:
            # Cluster DNS, so the management key never crosses the cluster
            # boundary: the console reaches the control plane over the Service
            # the platform chart creates, in the namespace it shares with it.
            #
            # A placeholder rather than a literal, like CONSOLE_IMAGE above: the
            # Service name is a function of the Helm release and namespace this
            # deployment happens to use, and this repository is public. The
            # workflow substitutes it from a repository variable. The token is
            # deliberately *not* spelled PLATFORM_BASE_URL — that is the name of
            # the variable being assigned two lines down, and a `sed` on that
            # word would rewrite the key as well as the value.
            - name: PLATFORM_BASE_URL
              value: CONTROLPLANE_URL
            - name: PLATFORM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: console-secrets
                  key: platform-api-key
            # There is deliberately no CONSOLE_PASSWORD here. Authentication for
            # this deployment is IAP, at the load balancer, and the container
            # therefore has no gate of its own: src/proxy.ts returns next()
            # before any check when the variable is unset, which is exactly what
            # is wanted — a page this pod serves has already been authorized by
            # something the pod cannot be talked out of.
            #
            # The Secret no longer carries a `console-password` key either: it
            # was kept only so that a revision predating this change could still
            # start if rolled back to, and `revisionHistoryLimit` above has
            # since put every such revision out of reach — see README.md in this
            # directory.
            #
            # Absence here is not sufficient to remove it from a live
            # Deployment that a `rollout undo` re-added it to: `apply` computes
            # deletions from the last-applied config, which a rollback does not
            # update. The workflow states the removal explicitly with
            # `kubectl set env … CONSOLE_PASSWORD-` for exactly that case.
            #
            # Two consequences that are not obvious and are handled elsewhere:
            # the deep health check stops gating itself at the same moment
            # (src/app/api/health/route.ts), and port 3000 is then open to the
            # cluster — closed by networkpolicy.yaml, which ships with this and
            # not after it.
          # The shallow check, deliberately — it reads configuration and touches
          # no network. The deep one (`?deep=1`) also calls the platform, so a
          # platform outage would fail the probe and take the console out of
          # service with it, when a console that can still render its own error
          # is worth more. The deep check is the deploy gate instead.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          # Not /api/health, and the difference matters: that route answers 503
          # for a *configuration* error, and no number of restarts supplies a
          # missing environment variable. Pointed there, liveness would turn the
          # readiness failure the rollout is waiting to report into a restart
          # loop that erases it — kubelet churn where `Readiness probe failed`
          # should be. Liveness has one question, and it is not readiness's:
          # does this process still answer HTTP at all? /login answers that
          # without reading PLATFORM_BASE_URL or PLATFORM_API_KEY, which is the
          # whole reason it is the probe target — it renders unconditionally,
          # including on a deployment like this one that has no gate for it to
          # front.
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Sized for a Next.js server rendering for a handful of operators, not
          # measured under load — revisit if the pod is ever throttled or OOMs.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # readOnlyRootFilesystem is left off: Next.js writes under
            # .next/cache at runtime, and a read-only root would trade a real
            # startup failure for a hardening line this deployment does not need.
