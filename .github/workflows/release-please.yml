name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Not GITHUB_TOKEN: a pull request it opens triggers no workflows, so the
      # release PR would never collect the ci-ok and docker checks `main`
      # requires — and enforce_admins means nobody could merge it. A GitHub App
      # mints a fresh hour-long token from a key that does not expire; a
      # fine-grained PAT would be capped at 366 days by org policy and would
      # take the pipeline down silently when it lapsed.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # skip-changelog is set in release-please-config.json: this repository's
      # CHANGELOG.md is hand-written prose and stays that way. The tool owns
      # package.json, the tag and the GitHub Release; `pnpm release:prepare`
      # files the changelog section a release ships with.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
