name: release request

# This workflow can be loaded from a tag or operator-selected ref. It passes a
# candidate tag to the default-branch publisher and receives no write access.
run-name: Release request ${{ inputs.tag || github.event.release.tag_name }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to build and publish, e.g. v0.1.0"
        required: true
        type: string

permissions: {}

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the request
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] &&
             [[ "$GITHUB_REF" != refs/heads/main || "$REF_PROTECTED" != true ]]; then
            echo "::error::Dispatch release requests from protected main"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable vX.Y.Z release tag"
            exit 1
          fi
