name: release

# Publishes the console image for a tag. Tag pushes fire this automatically;
# workflow_dispatch exists because tag-push triggers do not run retroactively —
# v0.1.0 was pushed before this workflow existed and still needs an image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/opensdlc-dev/managed-agent-console

jobs:
  # One native runner per architecture: emulating a Next.js build under QEMU is
  # slow enough to be its own argument, and arm64 runners are free for public
  # repositories. Each leg scans before it pushes, so nothing reaches the
  # registry that the gate has not already cleared.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # The tag is the version. Disagreeing with package.json means the release
      # was cut wrong, and a published image is the worst place to find out.
      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkg" ]; then
            echo "::error::tag $ref says $version, package.json says $pkg"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            --build-arg REVISION="${{ github.sha }}" \
            -t "$IMAGE:${{ steps.version.outputs.version }}-${{ matrix.arch }}" .

      - name: Scan image (trivy, HIGH/CRITICAL gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push architecture image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.version.outputs.version }}-${{ matrix.arch }}"

  # Joins the two scanned architecture images into one manifest list. buildx
  # ships on the runner, so this needs no third-party action.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # appends the image block to the GitHub Release
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Create the manifest list
        id: manifest
        env:
          V: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create \
            -t "$IMAGE:$V" -t "$IMAGE:$MINOR" -t "$IMAGE:latest" \
            "$IMAGE:$V-amd64" "$IMAGE:$V-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$V" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo
            echo '```'
            echo "$IMAGE:$V"
            echo "$IMAGE:$MINOR"
            echo "$IMAGE:latest"
            echo
            echo "digest: $digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Idempotent: re-dispatching the same tag replaces the block rather than
      # stacking a second one.
      - name: Record the image on the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          V: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no GitHub Release for $TAG yet — skipping"
            exit 0
          fi
          notes="$(gh release view "$TAG" --json body --jq .body)"
          notes="${notes%%<!-- image -->*}"
          {
            printf '%s' "$notes"
            printf '\n<!-- image -->\n\n## Image\n\n```\ndocker pull %s:%s\n```\n\nMulti-arch (`linux/amd64`, `linux/arm64`), digest `%s`.\n' \
              "$IMAGE" "$V" "$DIGEST"
          } > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
