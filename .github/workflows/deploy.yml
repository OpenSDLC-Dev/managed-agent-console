name: deploy

# Continuous delivery of the console to the staging GKE cluster.
#
# The trigger is a push to `main` — there is one environment, so "deployed" and
# "merged" are the same event and a separate promotion step would only be a
# button somebody forgets to press. workflow_dispatch stays for re-deploying
# without a commit (a rotated secret, a cluster rebuilt under the same name);
# that works because the pod template carries a checksum of the two secret
# payloads, so a rotation changes the Deployment and the pod actually rolls.
#
# **No GitHub secret is involved.** The job mints a short-lived OIDC token,
# Workload Identity Federation exchanges it for an impersonation of
# the deploy service account, and every credential the deployment needs — the platform's
# management key, the console password — is read from Secret Manager inside the
# job. Nothing long-lived is stored in this repository, and rotating a value
# means adding a Secret Manager version, not editing settings here.
#
# What this workflow owns: build → push → deploy → smoke. It does **not** run
# Terraform. Infrastructure (the cluster, the WIF pool, the service account, the
# secrets themselves) stays human-driven and interactive by design.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token WIF exchanges; nothing else needs writing

# Queued, never cancelled: cancelling mid-rollout leaves the cluster holding
# half of one revision and half of another, which is worse than waiting.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Which deployment this is. These name one GCP project, one cluster and one
# registry, and this repository is public — so they live in repository
# *variables* rather than in this file. They are not secrets (none of them
# grants anything; the credentials are in Secret Manager and the trust policy is
# what protects the deployment), they are simply this operator's, and a public
# repository that names them couples an open-source project to one cluster.
# Set them under Settings → Secrets and variables → Actions → Variables.
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ZONE: ${{ vars.GCP_ZONE }}
  CLUSTER: ${{ vars.GKE_CLUSTER }}
  NAMESPACE: ${{ vars.K8S_NAMESPACE }}
  IMAGE: ${{ vars.CONSOLE_IMAGE_REPO }}
  REGISTRY_HOST: ${{ vars.ARTIFACT_REGISTRY_HOST }}
  CONTROLPLANE_URL: ${{ vars.PLATFORM_BASE_URL }}
  CONSOLE_HOST: ${{ vars.CONSOLE_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `shell: bash` rather than the implicit `bash -e {0}`, for one word of
    # difference: it runs `bash --noprofile --norc -eo pipefail`. Without
    # pipefail only the *last* command of a pipeline decides the step, and the
    # two pipelines below both end in `kubectl apply` — a `sed` that failed on
    # one manifest would feed `apply` a partial set of objects, and the step
    # would report success on a deployment that never received half of what it
    # was sent.
    defaults:
      run:
        shell: bash
    steps:
      # First, and before anything is authenticated or built: an unset variable
      # renders as the empty string, silently. `gcloud --project ""` does not
      # fail loudly, `kubectl -n ""` addresses the wrong namespace, and an
      # `IMAGE` of `":$GITHUB_SHA"` is a tag with no repository — so a
      # deployment configured by variables fails in exactly the shape this
      # pipeline exists to prevent unless it is asserted up front. Cheap, and it
      # is also the error message a new deployment of this repository gets
      # instead of a confusing failure four steps later.
      - name: Require the deployment variables
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for v in PROJECT_ID ZONE CLUSTER NAMESPACE IMAGE REGISTRY_HOST \
                   CONTROLPLANE_URL CONSOLE_HOST WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            # Whitespace-only counts as unset: a variable holding one space
            # passes a `-z` test on the raw value while being no configuration.
            if [ -z "$(printf '%s' "${!v}" | tr -d '[:space:]')" ]; then
              missing="$missing $v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::unset or empty repository variables:$missing — set them under Settings → Secrets and variables → Actions → Variables. See docs/deploy-gcp.md."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}
          # `kubectl` refuses to authenticate to GKE without this component, and
          # the runner's preinstalled gcloud may be package-managed (its own
          # component manager disabled) — so it is installed through the action
          # rather than with a bare `gcloud components install`. Installing it is
          # the whole mechanism: kubectl has used the plugin unconditionally
          # since 1.26, and the USE_GKE_GCLOUD_AUTH_PLUGIN variable that used to
          # opt in during the client-go transition is now ignored.
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      # Built on the runner and pushed, not submitted to Cloud Build: the runner
      # already holds the deploy identity, and a Cloud Build submission in this
      # project needs an explicit `--service-account` (projects created under an
      # organization no longer grant Editor to the Compute Engine default SA, so
      # the default identity cannot even stage the source bucket).
      #
      # amd64 only, and correctly so: the target is one cluster whose nodes are
      # e2 machines (x86-64). The release workflow builds multi-arch because it
      # publishes for whoever pulls; this one builds for a known host.
      - name: Build and push the image
        run: |
          version="$(node -p "require('./package.json').version")"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg REVISION="$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Get cluster credentials
        # --project explicitly, even though setup-gcloud configured it: reading
        # the wrong project here would be a silent deploy into someone else's
        # cluster.
        run: |
          gcloud container clusters get-credentials "$CLUSTER" \
            --zone "$ZONE" --project "$PROJECT_ID"

      - name: Sync console-secrets from Secret Manager
        run: |
          umask 077
          dir="$RUNNER_TEMP/console-secrets"
          # On EXIT, not as the last line: every `exit 1` and every `set -e`
          # failure below is a path that would otherwise leave both credentials
          # sitting in the runner's temp directory.
          trap 'rm -rf "$dir"' EXIT
          mkdir -p "$dir"

          # Through shell variables rather than straight into files, for the
          # trailing newline: `gcloud` returns the payload byte for byte, and a
          # payload added with `--data-file=-` from a terminal — which is how
          # the error messages below tell an operator to add one — carries the
          # newline they pressed. That byte would ride into the container as an
          # x-api-key Node refuses to send at all, and as a CONSOLE_PASSWORD
          # nobody can type — and the smoke gate below would not catch it, since
          # it logs in with the container's *own* copy of the value, proving the
          # gate closes and never that a human can open it.
          # Command substitution strips it; nothing else here would notice.
          api_key="$(gcloud secrets versions access latest \
            --secret=controlplane-api-key --project "$PROJECT_ID")"
          console_password="$(gcloud secrets versions access latest \
            --secret=console-password --project "$PROJECT_ID")"

          # Rejected before anything prints either value: `::add-mask::` is a
          # single-line workflow command, so masking a multi-line value echoes
          # every line after the first straight into this public log. A newline
          # surviving the substitution above means a genuinely multi-line
          # payload, which neither of these credentials can be.
          lines="$(printf '%s%s' "$api_key" "$console_password" | wc -l)"
          if [ "$lines" -ne 0 ]; then
            echo "::error::a Secret Manager payload for this deployment is multi-line — both credentials must be a single line"
            exit 1
          fi

          # Belt and braces: nothing below prints these, but a future `set -x`
          # would print the literal value, and a kubectl error quoting the
          # Secret prints its base64 `data:` block — a form no mask on the raw
          # string covers. Both forms are registered; a value transformed any
          # other way (split, re-encoded, URL-escaped) still is not, so this
          # does not license printing them.
          echo "::add-mask::$api_key"
          echo "::add-mask::$console_password"
          echo "::add-mask::$(printf '%s' "$api_key" | base64 -w0)"
          echo "::add-mask::$(printf '%s' "$console_password" | base64 -w0)"

          # Blank *or* whitespace-only. A payload of one space passes `[ -s ]`
          # while being no credential at all.
          if [ -z "$(printf '%s' "$api_key" | tr -d '[:space:]')" ]; then
            echo "::error::Secret Manager secret 'controlplane-api-key' is empty in $PROJECT_ID — the console cannot authenticate to the platform without it"
            exit 1
          fi
          # The hazard this pipeline exists inside: the console answers on a
          # public hostname with no authentication of its own. TLS changed how
          # the password crosses the wire, not what stands in front of the
          # management key — an empty gate is still an open page.
          if [ -z "$(printf '%s' "$console_password" | tr -d '[:space:]')" ]; then
            echo "::error::Secret Manager secret 'console-password' is empty in $PROJECT_ID — refusing to publish an ungated console on a public hostname. Add a version: gcloud secrets versions add console-password --project=$PROJECT_ID --data-file=-"
            exit 1
          fi

          # Files, not `--from-literal`: a value passed as an argument to a real
          # process (kubectl) is visible in the runner's process listing for as
          # long as that process lives.
          printf '%s' "$api_key" > "$dir/platform-api-key"
          printf '%s' "$console_password" > "$dir/console-password"

          # Idempotent: create the object we want, then apply it over whatever
          # is there. `kubectl create secret` alone fails on the second run.
          kubectl create secret generic console-secrets \
            --from-file=platform-api-key="$dir/platform-api-key" \
            --from-file=console-password="$dir/console-password" \
            --dry-run=client -o yaml \
            | kubectl apply -n "$NAMESPACE" -f -

          # What makes a rotation actually reach the pod. Applying a changed
          # Secret changes nothing the Deployment references by value, so the
          # pod template is byte-identical and Kubernetes rolls nothing; the
          # checksum rides in the template and makes the rotation a new
          # revision. Newline-separated because both payloads are single-line
          # (asserted above), so the concatenation is unambiguous.
          checksum="$(printf '%s\n%s' "$api_key" "$console_password" \
            | sha256sum | cut -d' ' -f1)"
          echo "SECRETS_CHECKSUM=$checksum" >> "$GITHUB_ENV"

      - name: Apply the manifests
        id: apply
        run: |
          # Set by the sync step. An empty value would apply an empty annotation
          # — a deployment that silently stops rolling on rotation.
          if [ -z "${SECRETS_CHECKSUM:-}" ]; then
            echo "::error::SECRETS_CHECKSUM is unset — the secret sync step must run before this one"
            exit 1
          fi

          # A Deployment's `spec.selector` is immutable, so `apply` cannot carry
          # a workload across a change to it — it fails outright:
          #
          #   The Deployment "console" is invalid: spec.selector: Invalid value:
          #   {"matchLabels":{"app.kubernetes.io/name":"console"}}: field is immutable
          #
          # This is not hypothetical here. The staging cluster still holds a
          # `console` Deployment applied by hand while this pipeline was being
          # proven, selecting on `app: console`, and deploy/k8s/deployment.yaml
          # selects on `app.kubernetes.io/name: console` — the label the Service
          # and the smoke step below both key off. Without this, the first run of
          # this workflow fails on that error after having already built and
          # pushed an image.
          #
          # Recreate only on a real mismatch: the comparison is against the live
          # object, so once the selector matches this is a `kubectl get` and
          # nothing else. Deleting is safe to do here and only here — this
          # workflow owns the Deployment, and the apply immediately below
          # recreates it.
          want='{"app.kubernetes.io/name":"console"}'
          live="$(kubectl get deployment console -n "$NAMESPACE" \
            -o jsonpath='{.spec.selector.matchLabels}' 2>/dev/null || true)"
          if [ -n "$live" ] && [ "$live" != "$want" ]; then
            echo "::warning::live console Deployment selects $live, manifests select $want — recreating (spec.selector is immutable)"
            kubectl delete deployment console -n "$NAMESPACE" --wait
          fi

          # An explicit sed on the placeholders. envsubst would expand every
          # other `$` in these files too, and the way that fails is a field
          # quietly emptied rather than an error — which is also why the tokens
          # are bare words rather than `${...}`: a manifest is applied by
          # kubectl, which substitutes nothing at all, so a shell-shaped
          # placeholder that escaped this step would reach the API server with
          # its dollar and braces intact.
          #
          # CONTROLPLANE_URL, not PLATFORM_BASE_URL: the value is assigned to a
          # container variable *of that name*, so a token spelled the same way
          # would rewrite the `name:` key beside it and produce a variable
          # called `http://…`.
          # sed's *replacement* text is not literal, which is the trap in
          # substituting a value somebody else configures: `&` expands to the
          # whole matched token, `\` opens an escape, and `|` closes the
          # expression. A base URL of `http://host/?a=1&b=2` renders as
          # `http://host/?a=1CONTROLPLANE_URLb=2` — a plausible-looking string
          # that deploys, and a console that cannot reach the platform. None of
          # the three values contains one today; being a repository variable is
          # exactly what stops that from being a property anyone can rely on.
          esc() { printf '%s' "$1" | sed -e 's/[\\&|]/\\&/g'; }
          for f in deploy/k8s/*.yaml; do
            echo "---"
            sed -e "s|CONSOLE_IMAGE|$(esc "$IMAGE:$GITHUB_SHA")|g" \
                -e "s|SECRETS_CHECKSUM|$(esc "$SECRETS_CHECKSUM")|g" \
                -e "s|CONTROLPLANE_URL|$(esc "$CONTROLPLANE_URL")|g" \
                -e "s|CONSOLE_HOST|$(esc "$CONSOLE_HOST")|g" "$f"
          done | kubectl apply -n "$NAMESPACE" -f -

          # Arms the rollback below, and only here: every failure *before* this
          # line left the cluster as it was, and rolling a healthy Deployment
          # back because the runner could not reach Secret Manager would be this
          # pipeline breaking staging by itself.
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the rollout
        run: kubectl rollout status deployment/console -n "$NAMESPACE" --timeout=5m

      # The gate. `rollout status` only proves the container starts and answers
      # the shallow probe, which touches no network — a revision with a wrong
      # key or a wrong base URL passes that. The deep check proves this revision
      # can actually reach the platform and be accepted.
      #
      # Run from inside the pod, over loopback, because the deep check answers
      # sessions only (src/app/api/health/route.ts): it is a lever that spends
      # the management key, and this console answers on a public hostname where
      # anyone at all could pull it. The container already holds
      # CONSOLE_PASSWORD, so it logs in to itself; the credential never leaves
      # the pod and nothing authenticated crosses the public address.
      #
      # The health body carries no URL and no key by construction, which is why
      # it is safe to print into a public log.
      - name: Smoke test the deployed revision
        run: |
          # By name, not `deploy/console`: `kubectl exec deploy/...` resolves the
          # selector and prefers the pod that has been ready longest, which right
          # after a rollout can still be the *previous* revision on its way out.
          # This gate is worthless if it tests the pod we just replaced. Image
          # *and* checksum, because a rotation re-deploys the same image with
          # different credentials — the pair is what identifies this revision.
          pod="$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=console -o json \
            | jq -r --arg image "$IMAGE:$GITHUB_SHA" --arg checksum "$SECRETS_CHECKSUM" '
                [ .items[]
                  | select(.metadata.deletionTimestamp == null)
                  | select(.status.phase == "Running")
                  | select(.metadata.annotations["console-secrets/checksum"] == $checksum)
                  | select(any(.spec.containers[]; .image == $image))
                  | .metadata.name ] | first // empty')"
          if [ -z "$pod" ]; then
            echo "::error::no running console pod is on $IMAGE:$GITHUB_SHA with this run's secret checksum — the rollout reported success but this revision is not serving"
            kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=console -o wide
            exit 1
          fi
          echo "deep check against pod/$pod"

          # Single-quoted so the shell expands nothing: this is JavaScript, run
          # by the container's own node against its own loopback address.
          kubectl exec -n "$NAMESPACE" "$pod" -- node -e '
            const base = "http://127.0.0.1:3000";
            (async () => {
              const password = process.env.CONSOLE_PASSWORD;
              if (!password) throw new Error("CONSOLE_PASSWORD is not set in the container");
              const login = await fetch(base + "/api/login", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ password: password }),
              });
              if (!login.ok) throw new Error("console login failed with " + login.status);
              const cookie = login.headers
                .getSetCookie()
                .map((c) => c.split(";")[0])
                .join("; ");
              const health = await fetch(base + "/api/health?deep=1", {
                headers: { cookie: cookie },
              });
              console.log(health.status, await health.text());
              if (health.status !== 200) {
                console.error("deep health check failed");
                process.exitCode = 1;
              }
            })().catch((e) => {
              console.error(String(e));
              process.exitCode = 1;
            });
          '

      # The only step that touches the public address, and what it asserts is
      # that the address is gated. Behind this hostname is a console holding a
      # full-power platform management key; "the deploy read a non-empty
      # password out of Secret Manager" is a different claim from "the thing
      # answering on the internet is gated", and only the second is worth
      # anything.
      - name: Assert the public address is gated
        run: |
          # First, and separately from the assertions: is there a certificate to
          # answer with at all? First issuance takes 15-60 minutes and the load
          # balancer may take 30 more to serve it, which is far longer than any
          # poll below is willing to wait. Without this check that shows up as a
          # five-minute timeout on a TLS handshake, followed by this job rolling
          # back a revision that is in every way healthy — the pipeline breaking
          # staging because infrastructure was still provisioning. Named as what
          # it is instead, in one line.
          cert="$(kubectl get managedcertificate console -n "$NAMESPACE" \
            -o jsonpath='{.status.certificateStatus}' 2>/dev/null || true)"
          if [ "$cert" != "Active" ]; then
            echo "::error::the managed certificate for $CONSOLE_HOST is ${cert:-absent}, not Active — the hostname cannot serve HTTPS yet. FAILED_NOT_VISIBLE is a waiting state (15-60 min from first issuance); if it persists, check that the A record is DNS-only and points at the console-ip address."
            kubectl describe managedcertificate console -n "$NAMESPACE" || true
            exit 1
          fi

          # Shallow, not deep: this caller is anonymous on purpose — it stands in
          # for anyone on the internet — and the deep depth refuses those now.
          # A 200 here proves the load balancer routes and the pod is serving.
          # It still polls: a rollout replaces the NEG's endpoints, and the new
          # backend has to pass GCLB's own health check before it is served.
          base="https://$CONSOLE_HOST"
          body="$RUNNER_TEMP/health.json"
          code=""
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 10 \
              "$base/api/health" || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "::error::$base answered ${code:-no response} on /api/health after five minutes — this revision is not reachable through the load balancer. A persistent 502 with a Ready pod means the backend health check is failing; it is pinned to /api/health on port 3000 in deploy/k8s/edge.yaml."
            cat "$body" || true
            echo
            kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=console
            kubectl describe ingress console -n "$NAMESPACE" || true
            exit 1
          fi
          cat "$body"
          echo

          # The console's own report that a gate is configured…
          if ! jq -e '.login_gate == true' "$body" > /dev/null; then
            echo "::error::the deployed console reports login_gate=false — the public hostname is fronting a full-power platform management key with nothing in front of it. Check CONSOLE_PASSWORD reached the pod."
            exit 1
          fi

          # …and the gate actually closing on an anonymous caller, which is the
          # claim that matters. src/proxy.ts answers a page request without a
          # session with NextResponse.redirect, which is a 307, to /login.
          read -r code redirect <<< "$(curl -sS -o /dev/null \
            -w '%{http_code} %{redirect_url}' --max-time 10 "$base/" || echo '000 -')"
          if [ "$code" != "307" ] || [ "${redirect%/login}" = "$redirect" ]; then
            echo "::error::anonymous GET / on $base answered ${code:-no response} (redirect: ${redirect:-none}) instead of a 307 to /login — the console is open on the internet in front of a full-power platform management key"
            exit 1
          fi
          echo "anonymous GET / -> $code $redirect"

          # And that plain HTTP does not serve the console. FrontendConfig
          # redirects rather than refusing the connection, so the assertion is a
          # 3xx to the https:// form — `allow-http: "false"` would have made
          # this a connection error instead, which is why edge.yaml does not set
          # it. No -L anywhere here, so curl reports the redirect rather than
          # following it.
          read -r code redirect <<< "$(curl -sS -o /dev/null \
            -w '%{http_code} %{redirect_url}' --max-time 10 "http://$CONSOLE_HOST/" || echo '000 -')"
          case "$code:$redirect" in
            3??:https://*) echo "plain HTTP -> $code $redirect" ;;
            *)
              echo "::error::plain HTTP on $CONSOLE_HOST answered ${code:-no response} (redirect: ${redirect:-none}) instead of redirecting to https — check the FrontendConfig in deploy/k8s/edge.yaml"
              exit 1
              ;;
          esac

          {
            echo "### Deployed"
            echo
            echo '```'
            echo "image:   $IMAGE:$GITHUB_SHA"
            echo "console: $base"
            echo '```'
            echo
            echo "Gated: anonymous \`GET /\` answered a 307 to \`/login\`; plain HTTP redirects to HTTPS."
          } >> "$GITHUB_STEP_SUMMARY"

      # Every gate above this point detects; without this step none of them
      # remediates. Readiness is the *shallow* check, so a revision with a
      # rejected key, an unreachable control plane, or — worse — an ungated
      # public address passes `rollout status`, and the RollingUpdate has
      # already retired the pod that worked. Reporting that in red and leaving
      # it serving on the internet is the one outcome nobody wants. (The
      # platform gets this free from `helm upgrade --atomic`; with raw
      # manifests it is this step.)
      #
      # Armed by the apply step's output, so a failure that never touched the
      # cluster cannot trigger it. Broad on purpose otherwise: a `rollout
      # status` timeout means the new ReplicaSet is stuck retrying and undoing
      # it is exactly right, and the two smoke gates mean the new revision is
      # serving and should not be.
      - name: Roll back the revision that failed the gate
        if: failure() && steps.apply.outputs.applied == 'true'
        run: |
          echo "::warning::a step after the apply failed — rolling back to the previous revision"
          # A first deployment, and one the selector guard recreated, has no
          # previous revision. `undo` says so and exits non-zero; there is
          # nothing to roll back to and the operator has to be told that
          # plainly rather than left reading a green rollback that did nothing.
          if ! kubectl rollout undo deployment/console -n "$NAMESPACE"; then
            echo "::error::no previous revision to roll back to — the console is left on the revision that failed the gate. Take it out of service by hand: kubectl scale deployment/console -n $NAMESPACE --replicas=0"
            kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=console -o wide
            exit 1
          fi
          kubectl rollout status deployment/console -n "$NAMESPACE" --timeout=5m
          kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=console -o wide
          # What a rollback restores is the pod *template* — image, and the
          # checksum annotation. It does not restore `console-secrets`, which
          # still holds whatever this run wrote into it, so a revision rolled
          # back after a bad rotation reads the same bad credential.
          echo "::warning::rolled back to the previous revision. This restores the image, not console-secrets — if a rotated credential caused the failure, disable that Secret Manager version and re-run the workflow."
