version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # release-please reads commit subjects; an unprefixed "Bump x from y to z"
    # is invisible to it and would also fail the pr-title check.
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Types track the runtime major (node 24 in Dockerfile + CI), not latest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
